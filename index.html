<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertão</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 3px 14px #0001}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:bold;margin-top:8px;background:#111;color:#fff}.hide{display:none}.product img{width:100%;max-height:320px;object-fit:contain}.price{font-size:28px;font-weight:bold}.old{text-decoration:line-through;color:#888}.ok{padding:10px;background:#e8f7ee;border-radius:10px}.err{padding:10px;background:#ffecec;border-radius:10px}.muted{color:#666;font-size:13px}</style></head><body><div class="app"><div class="card"><h1>🔥 Ofertão</h1><p class="muted">Cole seu link de afiliado do Mercado Livre, inclusive meli.la.</p><input id="url" placeholder="https://meli.la/..."/><select id="model"><option value="full">WhatsApp completa</option><option value="short">WhatsApp curta</option><option value="story">Instagram/Story</option></select><input id="coupon" placeholder="Cupom (opcional)"/><input id="note" placeholder="Observação (opcional)"/><button onclick="generate()">🚀 GERAR OFERTA</button><div id="status" class="muted"></div></div><div id="product" class="card hide"><img id="img"><h2 id="title"></h2><div id="price"></div><b id="off"></b></div><div id="result" class="card hide"><textarea id="text"></textarea><button onclick="copyText()">📋 COPIAR OFERTA</button><button onclick="shareText()">📲 COMPARTILHAR</button></div></div><script>
const $=id=>document.getElementById(id); const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
async function generate(){const url=$('url').value.trim(); if(!url){$('status').textContent='Cole um link.';return} $('status').textContent='Resolvendo o link e buscando o produto...'; try{const r=await fetch('/api/offer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível gerar'); $('img').src=d.image;$('title').textContent=d.title;$('price').innerHTML=d.old?`<span class="old">${money(d.old)}</span> → <span class="price">${money(d.actual)}</span>`:`<span class="price">${money(d.actual)}</span>`;$('off').textContent=d.discount?d.discount+'% OFF':'';let c=$('coupon').value.trim(),n=$('note').value.trim(),m=$('model').value,pl=d.old?`💰 De ${money(d.old)} por *${money(d.actual)}*`:`💰 Por apenas *${money(d.actual)}*`,di=d.discount?`🔥 *${d.discount}% OFF*`:'';let cu=c?`🎟️ *CUPOM:* ${c}`:'',no=n?`📌 ${n}`:'';let t=m==='short'?`🔥 *OFERTA!*\n\n🛍️ ${d.title}\n${pl}\n${di}\n${cu}\n${no}\n\n👉 ${url}`:m==='story'?`🔥 OFERTA DO DIA!\n\n🛍️ ${d.title}\n${pl}\n${di}\n${cu}\n${no}\n\n👉 COMPRE AQUI:\n${url}`:`🔥 *OFERTA DO DIA!*\n\n🛍️ *${d.title}*\n\n${pl}\n${di}\n${cu}\n${no}\n\n👉 *APROVEITE AQUI:*\n${url}\n\n⚠️ Preço e disponibilidade podem mudar sem aviso.`;$('text').value=t.replace(/\n{3,}/g,'\n\n').trim();$('product').classList.remove('hide');$('result').classList.remove('hide');$('status').className='ok';$('status').textContent='Oferta gerada com sucesso!'}catch(e){$('status').className='err';$('status').textContent=e.message}}
async function copyText(){try{await navigator.clipboard.writeText($('text').value);$('status').textContent='Copiado!'}catch(e){$('text').select();document.execCommand('copy')}} async function shareText(){if(navigator.share)try{await navigator.share({text:$('text').value})}catch(e){}else copyText()}
</script></body></html>
